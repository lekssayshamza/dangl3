[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dangl3"
version = "0.2.0"
description = "Conservative, evidence-based subdomain takeover triage"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["dns", "security", "subdomain-takeover", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = [
  "dnspython>=2.6,<3",
  "httpx>=0.27,<0.29",
  "typer>=0.12,<1",
  "rich>=13,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
dangl3 = "dangl3.cli:app"

[project.urls]
Repository = "https://github.com/lekssayshamza/dingl3"
Issues = "https://github.com/lekssayshamza/dingl3/issues"

[tool.setuptools.packages.find]
include = ["dangl3*", "integration_lab*"]

[tool.setuptools.package-data]
dangl3 = ["data/*.json"]
integration_lab = ["README.md", "fixtures/*.md", "fixtures/*.json", "fixtures/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
